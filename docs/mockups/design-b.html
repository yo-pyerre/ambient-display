<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weather Design B — Warm & Editorial</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bar-bg: rgba(12, 10, 9, 0.55);
    --bar-text: rgba(255, 248, 240, 0.6);
    --bar-bright: rgba(255, 248, 240, 0.92);
    --morning-bg: #0c0a09;
    --morning-text: #faf5ef;
    --morning-muted: rgba(250, 245, 239, 0.4);
    --morning-accent: #d4a574;
    --morning-border: rgba(250, 245, 239, 0.08);
    --morning-card-bg: rgba(255, 255, 255, 0.03);
  }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    font-family: Georgia, "Times New Roman", "Palatino Linotype", serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ── Artwork Background ── */
  .artwork-bg {
    position: fixed; inset: 0; z-index: 0;
    background:
      radial-gradient(ellipse at 25% 35%, #6b4423 0%, transparent 45%),
      radial-gradient(ellipse at 75% 65%, #2d4a3e 0%, transparent 40%),
      radial-gradient(ellipse at 50% 90%, #1a1412 0%, transparent 50%),
      linear-gradient(170deg, #3d2914 0%, #1f3028 45%, #2a1f18 75%, #0f0d0b 100%);
  }

  .artwork-bg::after {
    content: '';
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse at 40% 20%, rgba(212, 165, 116, 0.06) 0%, transparent 50%),
      radial-gradient(ellipse at 60% 70%, rgba(80, 120, 100, 0.05) 0%, transparent 45%);
  }

  /* ── Toggle ── */
  .view-toggle {
    position: fixed;
    top: 20px; left: 20px;
    z-index: 500;
    background: rgba(0, 0, 0, 0.35);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 248, 240, 0.08);
    color: rgba(255, 248, 240, 0.55);
    padding: 8px 18px;
    border-radius: 4px;
    font-size: 11px;
    font-family: -apple-system, "Segoe UI", Helvetica, sans-serif;
    font-weight: 400;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.3s ease;
  }
  .view-toggle:hover { background: rgba(0, 0, 0, 0.5); color: rgba(255, 248, 240, 0.8); }
  .view-toggle.morning-active {
    background: rgba(255, 255, 255, 0.05);
    border-color: rgba(255, 248, 240, 0.1);
    color: rgba(250, 245, 239, 0.4);
  }

  /* ── Bottom Bar ── */
  .bottom-bar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    z-index: 100;
    height: 48px;
    background: var(--bar-bg);
    backdrop-filter: blur(40px) saturate(1.3);
    -webkit-backdrop-filter: blur(40px) saturate(1.3);
    border-top: 1px solid rgba(255, 248, 240, 0.05);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 32px;
    transition: opacity 0.6s ease, transform 0.6s ease;
  }

  .bottom-bar.hidden {
    opacity: 0;
    transform: translateY(12px);
    pointer-events: none;
  }

  .bar-time {
    font-family: Georgia, serif;
    font-size: 14px;
    font-weight: 400;
    color: var(--bar-text);
    font-style: italic;
  }

  .bar-weather {
    display: flex;
    align-items: center;
    gap: 12px;
    font-family: -apple-system, "Segoe UI", Helvetica, sans-serif;
    font-size: 12px;
    font-weight: 300;
    color: var(--bar-text);
  }

  .bar-emoji { font-size: 14px; font-style: normal; }
  .bar-temp { color: var(--bar-bright); font-weight: 400; }
  .bar-sep { opacity: 0.2; }

  /* ── Morning Overlay ── */
  .morning-overlay {
    position: fixed; inset: 0;
    z-index: 200;
    background: var(--morning-bg);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.7s ease;
  }

  .morning-overlay.visible {
    opacity: 1;
    pointer-events: auto;
  }

  .morning-card {
    width: 100%;
    max-width: 580px;
    padding: 0 32px;
    opacity: 0;
    transform: translateY(16px);
    transition: opacity 0.6s ease 0.25s, transform 0.6s ease 0.25s;
  }

  .morning-overlay.visible .morning-card {
    opacity: 1;
    transform: translateY(0);
  }

  /* Clock */
  .morning-clock {
    font-size: clamp(3.5rem, 11vw, 6.5rem);
    font-weight: 400;
    font-style: italic;
    color: var(--morning-text);
    letter-spacing: -0.02em;
    line-height: 1;
    margin-bottom: 2px;
  }

  .morning-date {
    font-family: -apple-system, "Segoe UI", Helvetica, sans-serif;
    font-size: 12px;
    font-weight: 300;
    color: var(--morning-muted);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    margin-bottom: 52px;
  }

  /* Current */
  .morning-current {
    display: flex;
    align-items: baseline;
    gap: 14px;
    margin-bottom: 24px;
  }

  .current-emoji { font-size: 26px; position: relative; top: 3px; }

  .current-temp {
    font-size: 42px;
    font-weight: 400;
    color: var(--morning-text);
    letter-spacing: -0.02em;
  }

  .current-desc {
    font-family: -apple-system, "Segoe UI", Helvetica, sans-serif;
    font-size: 15px;
    font-weight: 300;
    color: var(--morning-muted);
  }

  /* Details */
  .morning-details {
    display: flex;
    flex-wrap: wrap;
    gap: 0;
    margin-bottom: 36px;
    padding-bottom: 36px;
    border-bottom: 1px solid var(--morning-border);
    font-family: -apple-system, "Segoe UI", Helvetica, sans-serif;
  }

  .detail-item {
    padding: 10px 20px 10px 0;
    font-size: 13px;
    color: var(--morning-muted);
    font-weight: 300;
    white-space: nowrap;
  }

  .detail-item:not(:last-child) {
    border-right: 1px solid var(--morning-border);
    margin-right: 20px;
  }

  .detail-value {
    color: var(--morning-text);
    font-weight: 400;
  }

  .detail-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--morning-muted);
    display: block;
    margin-bottom: 4px;
  }

  /* Forecast */
  .morning-forecast {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    margin-bottom: 36px;
    padding-bottom: 36px;
    border-bottom: 1px solid var(--morning-border);
  }

  .forecast-day {
    text-align: center;
    padding: 20px 8px;
    position: relative;
  }

  .forecast-day:not(:last-child)::after {
    content: '';
    position: absolute;
    right: 0; top: 20%; bottom: 20%;
    width: 1px;
    background: var(--morning-border);
  }

  .forecast-day-name {
    font-family: -apple-system, "Segoe UI", Helvetica, sans-serif;
    font-size: 10px;
    font-weight: 400;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--morning-muted);
    margin-bottom: 14px;
  }

  .forecast-day:first-child .forecast-day-name {
    color: var(--morning-accent);
  }

  .forecast-emoji {
    font-size: 20px;
    margin-bottom: 14px;
    line-height: 1;
  }

  .forecast-high {
    font-family: Georgia, serif;
    font-size: 16px;
    color: var(--morning-text);
    display: block;
    margin-bottom: 2px;
  }

  .forecast-low {
    font-family: -apple-system, "Segoe UI", Helvetica, sans-serif;
    font-size: 12px;
    color: var(--morning-muted);
    font-weight: 300;
  }

  /* Celestial */
  .morning-celestial {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-family: -apple-system, "Segoe UI", Helvetica, sans-serif;
  }

  .celestial-group {
    display: flex;
    align-items: center;
    gap: 20px;
  }

  .celestial-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--morning-muted);
    font-weight: 300;
  }

  .cel-emoji { font-size: 14px; }
  .cel-time { color: var(--morning-text); font-weight: 400; }
  .cel-divider { color: var(--morning-muted); opacity: 0.2; }

  .moon-info {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--morning-muted);
    font-weight: 300;
    font-style: italic;
    font-family: Georgia, serif;
  }

  /* ── Responsive ── */
  @media (max-width: 680px) {
    .morning-card { padding: 0 20px; }
    .morning-date { margin-bottom: 36px; }
    .morning-current { gap: 10px; }
    .current-emoji { font-size: 20px; }
    .current-temp { font-size: 32px; }
    .current-desc { font-size: 13px; }

    .detail-item { padding: 8px 14px 8px 0; font-size: 12px; }
    .detail-item:not(:last-child) { margin-right: 14px; }
    .detail-label { font-size: 9px; }

    .morning-forecast { gap: 0; }
    .forecast-day { padding: 14px 4px; }
    .forecast-day-name { font-size: 9px; }
    .forecast-emoji { font-size: 16px; }
    .forecast-high { font-size: 14px; }
    .forecast-low { font-size: 11px; }

    .morning-celestial { flex-direction: column; gap: 10px; align-items: flex-start; }
    .bottom-bar { padding: 0 20px; }
  }

  /* Label */
  .design-label {
    position: fixed;
    bottom: 60px; left: 32px;
    z-index: 90;
    font-family: -apple-system, "Segoe UI", Helvetica, sans-serif;
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: rgba(255, 248, 240, 0.15);
    transition: opacity 0.5s ease;
  }
  .design-label.hidden { opacity: 0; }
</style>
</head>
<body>

<div class="artwork-bg"></div>
<div class="design-label" id="designLabel">Design B · Warm & Editorial</div>

<button class="view-toggle" id="viewToggle" onclick="toggleView()">Morning View</button>

<!-- Bottom Bar -->
<div class="bottom-bar" id="bottomBar">
  <span class="bar-time" id="barTime">7:45 am</span>
  <div class="bar-weather">
    <span class="bar-emoji">⛅</span>
    <span class="bar-temp">72°F</span>
    <span class="bar-sep">·</span>
    <span>Partly Cloudy</span>
  </div>
</div>

<!-- Morning Overlay -->
<div class="morning-overlay" id="morningOverlay">
  <div class="morning-card">

    <div class="morning-clock" id="morningClock">7:45</div>
    <div class="morning-date">Thursday, February 6</div>

    <div class="morning-current">
      <span class="current-emoji">⛅</span>
      <span class="current-temp">72°F</span>
      <span class="current-desc">Partly Cloudy</span>
    </div>

    <div class="morning-details">
      <div class="detail-item">
        <span class="detail-label">Feels like</span>
        <span class="detail-value">68°F</span>
      </div>
      <div class="detail-item">
        <span class="detail-label">Humidity</span>
        <span class="detail-value">45%</span>
      </div>
      <div class="detail-item">
        <span class="detail-label">Wind</span>
        <span class="detail-value">8 mph</span>
      </div>
      <div class="detail-item">
        <span class="detail-label">UV Index</span>
        <span class="detail-value">3</span>
      </div>
    </div>

    <div class="morning-forecast">
      <div class="forecast-day">
        <div class="forecast-day-name">Today</div>
        <div class="forecast-emoji">⛅</div>
        <span class="forecast-high">75°</span>
        <span class="forecast-low">58°</span>
      </div>
      <div class="forecast-day">
        <div class="forecast-day-name">Fri</div>
        <div class="forecast-emoji">☀️</div>
        <span class="forecast-high">78°</span>
        <span class="forecast-low">60°</span>
      </div>
      <div class="forecast-day">
        <div class="forecast-day-name">Sat</div>
        <div class="forecast-emoji">🌤️</div>
        <span class="forecast-high">74°</span>
        <span class="forecast-low">57°</span>
      </div>
      <div class="forecast-day">
        <div class="forecast-day-name">Sun</div>
        <div class="forecast-emoji">🌧️</div>
        <span class="forecast-high">65°</span>
        <span class="forecast-low">52°</span>
      </div>
      <div class="forecast-day">
        <div class="forecast-day-name">Mon</div>
        <div class="forecast-emoji">☀️</div>
        <span class="forecast-high">71°</span>
        <span class="forecast-low">55°</span>
      </div>
    </div>

    <div class="morning-celestial">
      <div class="celestial-group">
        <div class="celestial-item">
          <span class="cel-emoji">🌅</span>
          <span class="cel-time">6:42 AM</span>
        </div>
        <span class="cel-divider">—</span>
        <div class="celestial-item">
          <span class="cel-emoji">🌇</span>
          <span class="cel-time">5:38 PM</span>
        </div>
      </div>
      <div class="moon-info">
        <span>🌒</span>
        <span>Waxing Crescent</span>
      </div>
    </div>

  </div>
</div>

<script>
  let isMorning = false;

  function toggleView() {
    isMorning = !isMorning;
    const overlay = document.getElementById('morningOverlay');
    const bar = document.getElementById('bottomBar');
    const btn = document.getElementById('viewToggle');
    const label = document.getElementById('designLabel');

    if (isMorning) {
      overlay.classList.add('visible');
      bar.classList.add('hidden');
      btn.textContent = 'Slideshow View';
      btn.classList.add('morning-active');
      label.classList.add('hidden');
    } else {
      overlay.classList.remove('visible');
      bar.classList.remove('hidden');
      btn.textContent = 'Morning View';
      btn.classList.remove('morning-active');
      label.classList.remove('hidden');
    }
  }

  function updateBarTime() {
    const now = new Date();
    let h = now.getHours();
    const m = String(now.getMinutes()).padStart(2, '0');
    const ampm = h >= 12 ? 'pm' : 'am';
    h = h % 12 || 12;
    document.getElementById('barTime').textContent = h + ':' + m + ' ' + ampm;
  }

  function updateMorningClock() {
    const now = new Date();
    let h = now.getHours();
    const m = String(now.getMinutes()).padStart(2, '0');
    h = h % 12 || 12;
    document.getElementById('morningClock').textContent = h + ':' + m;
  }

  updateBarTime();
  updateMorningClock();
  setInterval(updateBarTime, 1000);
  setInterval(updateMorningClock, 1000);
</script>
</body>
</html>
